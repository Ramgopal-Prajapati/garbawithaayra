{% extends 'core/base.html' %}

{% block title %}Login - Garba with Aayra{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-5 bg-dark border-secondary shadow-lg">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">Welcome Back</h2>
                    <p class="opacity-75">Login to Garba with Aayra</p>
                </div>

                {% if error_message %}
                <div class="alert alert-danger">{{ error_message }}</div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label opacity-75 small mb-1">Email</label>
                       <input type="email" name="username" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label opacity-75 small mb-1">Password</label>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold">Login</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top border-secondary">
                    <p class="mb-0 opacity-75">Don't have an account? <a href="/register/" class="text-primary text-decoration-none fw-bold">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
